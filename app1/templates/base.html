{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django Blog{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="bg-[#C05800] text-[#FDFDD4] p-4 flex justify-between items-center h-12">
        
        <h1 class="text-2xl mr-4 text-center my-4">Rk_starking</h1>
        
        {% include 'navbar.html' %}
    </header>
        {% block content %}{% endblock %}
    <footer class="bg-[#C05800] text-[#FDFDD4] p-4 text-center">
        <p>&copy; 2024 My Django Blog. All rights reserved.</p>

    </footer>
    
</body>
</html>
